<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課外活動紀錄｜鄭庭蓁</title>
    <!-- 串接與首頁相同的樣式檔與字體 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* 針對活動內頁微調的專屬樣式 */
        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #0d47a1;
        }
        .activity-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            .activity-card {
                flex-direction: row;
            }
            .activity-img {
                width: 35%;
                max-width: 300px;
            }
            .activity-content {
                width: 65%;
            }
        }
        .activity-img {
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 200px;
        }
        .activity-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .activity-content {
            padding: 30px;
        }
        .activity-tag {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .activity-content h3 {
            margin: 0 0 8px 0;
            color: #1565c0;
            font-size: 22px;
        }
        .activity-meta {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
        }
        .activity-content p {
            color: #444;
            line-height: 1.7;
            margin: 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>🌟 課外活動成果</h1>
    <p>拓展視野，累積多元學習與團隊合作經驗</p>
</header>

<div class="container">
    <!-- 返回首頁按鈕 -->
    <a href="/" class="back-btn">← 返回自我介紹首頁</a>

    <!-- 活動項目：啟夢營隊-->
    <div class="activity-card">
        <div class="activity-img">
            <!-- 圖片路徑：static/images/tech_forum.jpg -->
            <!-- 內建 onerror 機制，若圖片不存在會自動載入高質感科技示意圖，防止破圖 -->
            <img src="{{ url_for('static', filename='images/tech_forum.jpg') }}" alt="科技與未來趨勢論壇成果照片" onerror="this.src='https://unsplash.com';">
        </div>
        <div class="activity-content">
            <span class="activity-tag">營隊活動</span>
            <h3>啟夢夏令營:社會組</h3>
            <div class="activity-meta">活動日期：2025年7月｜主辦單位：啟夢股份公司</div>
            <p>
               
            </p>
        </div>
    </div>

</div>

<footer>
    © 2026 鄭庭蓁 學習歷程檔案
</footer>

</body>
</html>
